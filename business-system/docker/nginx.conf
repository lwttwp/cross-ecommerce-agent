# 跨境电商智能订单助手 - Nginx 站点配置
# 静态文件自己处理，PHP 请求转发�?php-api 容器�?PHP-FPM(9000)
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;

    # 安全响应�?    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Laravel 前端控制器：找不到真实文件就交给 index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    # AI ������������(/chat -> chat ���� 8082, �� WebSocket upgrade)
    location /chat/ {
        proxy_pass http://chat:8082/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    error_page 404 /index.php;

    # PHP 请求 �?PHP-FPM
    location ~ \.php$ {
        fastcgi_pass php-api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Laravel 必需：fastcgi_params 默认不带 Authorization 头，这里显式传递（Bearer Token 鉴权依赖它）
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
    }

    # 禁止访问隐藏文件�?env / .git 等）
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
