[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-ecommerce-agent"
version = "0.1.0"
description = "跨境电商智能订单助手 - Agent 层（LangGraph 多代理 + MCP + RAG）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
    "mcp>=1.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
